name: P16 Stage8 Runner

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  stage8:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner environment
        run: |
          set -eux
          uname -a
          which google-chrome || true
          google-chrome --version || true
          python3 --version
          node --version

      - name: Run Phase16A Stage8
        run: |
          set -eux

          cd p16-stage8

          python3 -m http.server 8765 > /tmp/p16-http.log 2>&1 &
          SERVER_PID=$!

          trap 'kill $SERVER_PID || true' EXIT

          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then
              echo "LOCALHOST_READY"
              break
            fi
            sleep 1
          done

          python3 stage8_runner.py
